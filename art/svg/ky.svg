<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
  <!-- Ky: lean medium dog, very dark black-brown short glossy fur, huge upright pointy ears, slim muzzle, amber eyes, grey chin. Faces right, galloping.
       Legs are a wide dark stroke under a narrower coloured one, so they bend smoothly for the run animation. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <g id="tail">
      <path fill="none" stroke="#120d0b" stroke-width="19" d="M120 124 Q86 108 70 70 Q66 58 74 52"/>
      <path fill="none" stroke="#2b211d" stroke-width="11" d="M120 124 Q86 108 70 70 Q66 58 74 52"/>
    </g>
    <!-- far legs, a shade darker -->
    <g id="legsFar">
      <path fill="none" stroke="#120d0b" stroke-width="25" d="M148 150 Q140 180 122 198 Q112 210 104 218"/>
      <path fill="none" stroke="#1b1411" stroke-width="16" d="M148 150 Q140 180 122 198 Q112 210 104 218"/>
      <ellipse cx="98" cy="222" rx="13" ry="8" fill="#1b1411" stroke="#120d0b" stroke-width="4.5"/>
      <path fill="none" stroke="#120d0b" stroke-width="25" d="M258 160 Q276 186 296 204 Q306 212 318 214"/>
      <path fill="none" stroke="#1b1411" stroke-width="16" d="M258 160 Q276 186 296 204 Q306 212 318 214"/>
      <ellipse cx="324" cy="214" rx="13" ry="8" fill="#1b1411" stroke="#120d0b" stroke-width="4.5"/>
    </g>
    <!-- body: deep chest, tucked waist -->
    <path id="body" fill="#2b211d" stroke="#120d0b" stroke-width="5" d="M112 118 C130 96 200 92 250 100 C286 106 300 136 288 164 C278 184 250 180 228 168 C204 160 182 158 164 160 C140 162 118 156 110 142 Z"/>
    <path fill="none" stroke="#5a4740" stroke-width="4" d="M140 108 C176 100 214 100 246 106"/>
    <!-- near legs: hind leg kicked back, front leg reaching forward -->
    <g id="legsNear">
      <path fill="none" stroke="#120d0b" stroke-width="31" d="M132 138 Q128 176 108 196 Q94 210 80 226"/>
      <path fill="none" stroke="#2b211d" stroke-width="21" d="M132 138 Q128 176 108 196 Q94 210 80 226"/>
      <ellipse cx="74" cy="230" rx="15" ry="9" fill="#2b211d" stroke="#120d0b" stroke-width="5"/>
      <path fill="none" stroke="#120d0b" stroke-width="29" d="M270 152 Q292 186 316 206 Q330 216 344 220"/>
      <path fill="none" stroke="#2b211d" stroke-width="19" d="M270 152 Q292 186 316 206 Q330 216 344 220"/>
      <ellipse cx="350" cy="221" rx="15" ry="9" fill="#2b211d" stroke="#120d0b" stroke-width="5"/>
    </g>
    <!-- neck and head -->
    <path id="neck" fill="#2b211d" stroke="#120d0b" stroke-width="5" d="M248 108 C262 86 286 74 306 82 L316 124 C298 138 278 144 262 146 Z"/>
    <g id="head" stroke="#120d0b">
      <!-- far ear -->
      <path fill="#1b1411" stroke-width="5" d="M284 86 L278 12 L316 74 Z"/>
      <!-- skull and slim muzzle -->
      <ellipse cx="318" cy="96" rx="34" ry="29" fill="#2b211d" stroke-width="5"/>
      <path fill="#2b211d" stroke-width="5" d="M334 84 C354 84 376 88 392 94 C396 102 390 110 380 112 C364 116 346 116 334 114 Z"/>
      <path fill="none" stroke="#5a4740" stroke-width="3.5" d="M300 80 C310 72 324 70 334 74"/>
      <!-- grey chin -->
      <path fill="#8f8a86" stroke-width="3.5" d="M330 114 C344 122 362 122 376 116 C364 126 344 128 330 122 Z"/>
      <!-- open mouth and tongue -->
      <path fill="#7a2a2f" stroke-width="3.5" d="M346 112 C360 118 374 118 384 110 C378 124 356 126 346 118 Z"/>
      <path fill="#f07a8c" stroke-width="3.5" d="M356 118 C360 134 368 144 376 140 C380 134 376 124 370 119 Z"/>
      <path fill="none" stroke="#c94a5c" stroke-width="2" d="M366 122 L371 136"/>
      <ellipse cx="392" cy="96" rx="8" ry="6.5" fill="#0d0908" stroke-width="4"/>
      <circle cx="394" cy="94" r="2" fill="#6b625e" stroke="none"/>
      <!-- amber eye with a cheeky brow -->
      <path fill="#ffffff" stroke-width="3" d="M324 88 C328 80 342 80 346 88 C342 95 328 95 324 88 Z"/>
      <circle cx="337" cy="88" r="5" fill="#e09a34" stroke="none"/>
      <circle cx="338" cy="88" r="2.4" fill="#120d0b" stroke="none"/>
      <circle cx="339.5" cy="86.5" r="1.1" fill="#fff" stroke="none"/>
      <path fill="none" stroke="#5a4740" stroke-width="3.5" d="M322 77 C330 71 340 71 347 77"/>
      <!-- near ear: huge and upright -->
      <path fill="#2b211d" stroke-width="5" d="M296 80 L316 0 L340 78 Z"/>
      <path fill="#5c3a37" stroke="none" d="M306 74 L316 22 L330 74 Z"/>
      <!-- whiskers -->
      <path fill="none" stroke="#8f8a86" stroke-width="2" d="M372 102 L396 98 M372 106 L396 110"/>
    </g>
  </g>
</svg>
